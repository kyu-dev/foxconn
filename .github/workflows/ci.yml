name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push on the same branch cancels the run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from "packageManager" in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unit tests only: integration tests need a real LLM and are run locally
      - run: pnpm check
