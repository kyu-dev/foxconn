services:
  dev:
    hostname: foxconn
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      # Linux node_modules, apart from the host's macOS ones (native binaries differ)
      - node_modules:/app/node_modules
    ports:
      - "127.0.0.1:4111:4111"
    env_file:
      - path: .env
        required: false
    environment:
      # Listen beyond the container's loopback, but let Studio call the page's origin (browsers block 0.0.0.0)
      MASTRA_HOST: 0.0.0.0
      MASTRA_AUTO_DETECT_URL: "true"

volumes:
  node_modules:
